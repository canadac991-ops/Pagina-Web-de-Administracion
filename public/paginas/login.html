<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Document</title>
</head>

<body>
    <div id="box_content">

        <div id="imagen">
            <img id="sombrero" src="../iconos/sombrero.png">
            <p id="titulo_texto">Gestion de Estudiantes</p>
            <p id="titulo_desc">Plataforma para la administración y seguimiento académico.</p>
            <img id="imagen_prentacion" src="../imagenes/image_login.png">
        </div>

        
        <div id="login_box">
            <div id="box_titulo">
            <p id="titulo_texto">Iniciar Sesión</p>
            <p id="titulo_desc">Ingresa tus credenciales para ingresar a tu cuenta.</p>
            </div>
            <div class="inputs">
                <label>nombre</label>
                <div class="input_imagen"><img class="imagen" src="../iconos/correo.png"><input id="input_nombre"type="text" placeholder="nombre"></div>
                <label id="error_nombre"></label>
            </div>
            <div class="inputs">
                <label>contraseña</label>
                <div class="input_imagen"><img class="imagen" src="../iconos/key.png"><input id="input_password" type="password" placeholder="**********"></div>
                <label id="error_contraseña"></label>
            </div>
            <button id="boton_ingresar" type="button">Ingresar</button>
        </div>

    </div>
</body>
<script src="../js/login.js"></script>



</html>
